    <!-- Tailwind는 src/index.css(@import "tailwindcss")에서 빌드. 색상 토큰 매핑은 @theme 참조. -->

    <!-- ───────── IGGG Design System v1.1 — Tokens & Patterns ───────── -->
    <style>
      :root {
        --fz-display-xl: clamp(3rem, 7vw, 5rem);
        --fz-display-l:  clamp(2rem, 5vw, 3rem);
        --fz-display-m:  1.5rem;
        --fz-body:       0.9375rem;
        --fz-mono-l:     0.8125rem;
        --fz-mono-m:     0.6875rem;
        --fz-mono-s:     0.625rem;

        --ls-display:    -0.02em;
        --ls-mono:       0.08em;
        --ls-mono-wide:  0.18em;

        --line-1: 1px;
        --radius-cap: 999px;
        --radius-md: 4px;

        --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
        --sp-6: 24px; --sp-8: 32px;

        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --dur-fast: 120ms;
        --dur-base: 200ms;

        --ff-display: "Inter", "Pretendard Variable", system-ui, sans-serif;
        --ff-mono:    "JetBrains Mono", ui-monospace, monospace;
        --ff-body:    "Pretendard Variable", "Inter", system-ui, sans-serif;
      }

      :root[data-theme="dark"] {
        --bg:        #0a0a0a;
        --bg-elev:   #141414;
        --bg-input:  #2d2d2d;
        --bg-input-focus: #383838;
        --fg:        #f4f2ed;
        --fg-mute:   rgba(244, 242, 237, 0.6);
        --fg-faint:  rgba(244, 242, 237, 0.4);
        --line:      rgba(244, 242, 237, 0.55);
        --line-soft: rgba(244, 242, 237, 0.35);
        --accent:    #f4f2ed;
        --accent-fg: #0a0a0a;
        --danger:    #ff6b5e;
        --success:   #6ec47a;
        --warning:   #d4a849;
        --grain-opacity: 0.08;
      }

      :root[data-theme="light"] {
        --bg:        #f4f2ed;
        --bg-elev:   #ebe8e1;
        --bg-input:  #ffffff;
        --bg-input-focus: #ffffff;
        --fg:        #0a0a0a;
        --fg-mute:   rgba(10, 10, 10, 0.62);
        --fg-faint:  rgba(10, 10, 10, 0.32);
        --line:      rgba(10, 10, 10, 0.55);
        --line-soft: rgba(10, 10, 10, 0.16);
        --accent:    #0a0a0a;
        --accent-fg: #f4f2ed;
        --danger:    #c8302a;
        --success:   #2d8a3a;
        --warning:   #b8841e;
        --grain-opacity: 0.04;
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) {
          --bg: #f4f2ed; --bg-elev: #ebe8e1;
          --bg-input: #ffffff; --bg-input-focus: #ffffff;
          --fg: #0a0a0a;
          --fg-mute: rgba(10,10,10,0.62);
          --fg-faint: rgba(10,10,10,0.32);
          --line: rgba(10,10,10,0.55); --line-soft: rgba(10,10,10,0.16);
          --accent: #0a0a0a; --accent-fg: #f4f2ed;
          --danger: #c8302a; --success: #2d8a3a; --warning: #b8841e;
          --grain-opacity: 0.04;
        }
      }

      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--ff-body);
        font-size: var(--fz-body);
        -webkit-font-smoothing: antialiased;
        transition: background var(--dur-base), color var(--dur-base);
      }

      input[type="text"], input[type="number"], select, textarea {
        background: var(--bg-input);
        color: var(--fg);
        transition: background var(--dur-fast), border-color var(--dur-fast);
      }
      input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
        outline: none;
        background: var(--bg-input-focus) !important;
        border-color: var(--fg) !important;
      }
      input::placeholder { color: var(--fg-faint); }
      select { color: var(--fg); }
      select option { background: var(--bg-elev); color: var(--fg); }

      :root[data-theme="dark"] select {
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f4f2ed' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
      }

      :root[data-theme="dark"] .shadow {
        box-shadow: 0 1px 0 rgba(0,0,0,0.4);
      }

      /* Theme toggle */
      .theme-toggle {
        position: fixed;
        top: var(--sp-3);
        right: var(--sp-3);
        z-index: 100;
        background: var(--bg);
        border: var(--line-1) solid var(--line);
        border-radius: var(--radius-cap);
        padding: var(--sp-1) var(--sp-3);
        font-family: var(--ff-mono);
        font-size: var(--fz-mono-m);
        letter-spacing: var(--ls-mono);
        color: var(--fg);
        cursor: pointer;
        text-transform: uppercase;
        transition: background var(--dur-fast);
      }
      .theme-toggle:hover { background: var(--bg-elev); }

      /* 공통 셸(허브·계정·로그아웃) — 12앱 공통 규약 2026-07-28.
         테마 토글을 이 줄 안으로 넣고(고정 위치는 줄이 가져간다) 좌측에 3종을 둔다. */
      .iggg-topbar {
        position: fixed;
        top: var(--sp-3);
        right: var(--sp-3);
        z-index: 100;
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        max-width: calc(100vw - var(--sp-6));
      }
      .iggg-topbar .theme-toggle { position: static; top: auto; right: auto; z-index: auto; }
      .iggg-shell-btn {
        background: var(--bg);
        border: var(--line-1) solid var(--line-soft);
        border-radius: var(--radius-cap);
        padding: var(--sp-1) var(--sp-3);
        font-family: var(--ff-mono);
        font-size: var(--fz-mono-m);
        letter-spacing: var(--ls-mono);
        color: var(--fg-mute);
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        transition: color var(--dur-fast), border-color var(--dur-fast);
      }
      .iggg-shell-btn:hover { color: var(--fg); border-color: var(--line); }
      #igShellLogout:hover { color: var(--danger); border-color: var(--danger); }
      .iggg-shell-email {
        font-family: var(--ff-mono);
        font-size: var(--fz-mono-s);
        letter-spacing: var(--ls-mono);
        color: var(--fg-faint);
        max-width: 20vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .iggg-shell-email:empty { display: none; }
      /* 모바일: 한 줄 유지(칩 패딩 축소 + 이메일 말줄임) + 히어로가 줄 아래에서 시작 */
      @media (max-width: 560px) {
        .iggg-topbar { gap: var(--sp-1); }
        .iggg-shell-btn { padding: var(--sp-1) var(--sp-2); }
        .iggg-topbar .theme-toggle { padding: var(--sp-1) var(--sp-2); }
        .iggg-shell-email { max-width: 24vw; }
        .iggg-hero { padding-top: 56px; }
      }

      /* Hero */
      .iggg-hero {
        padding: var(--sp-8) 0 var(--sp-4);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--sp-3);
        border-bottom: var(--line-1) dashed var(--line-soft);
        margin-bottom: var(--sp-4);
      }
      .iggg-hero__title {
        font-family: var(--ff-display);
        font-weight: 900;
        font-size: var(--fz-display-l);
        letter-spacing: var(--ls-display);
        line-height: 1;
        color: var(--fg);
        text-align: center;
      }
      .iggg-hero__meta {
        display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: baseline; justify-content: center;
      }
      .iggg-hero__meta span {
        font-family: var(--ff-mono);
        font-size: var(--fz-mono-s);
        letter-spacing: var(--ls-mono);
        color: var(--fg-faint);
        text-transform: uppercase;
      }

      /* Footer */
      .iggg-footer {
        border-top: var(--line-1) dashed var(--line-soft);
        margin-top: var(--sp-8);
        padding: var(--sp-4) 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--sp-3);
        flex-wrap: wrap;
      }
      .iggg-footer span {
        font-family: var(--ff-mono);
        font-size: var(--fz-mono-s);
        letter-spacing: var(--ls-mono);
        color: var(--fg-faint);
        text-transform: uppercase;
      }

      /* Grain overlay */
      body::before {
        content: "";
        position: fixed; inset: 0; pointer-events: none; z-index: 1;
        opacity: var(--grain-opacity);
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        mix-blend-mode: overlay;
      }
      body > * { position: relative; z-index: 2; }
    </style>
  </head>
  <body>
    <!-- 공통 셸 — 허브 복귀 · 로그인 계정 · 로그아웃(12앱 공통 규약 2026-07-28) -->
    <div class="iggg-topbar">
      <a class="iggg-shell-btn" href="https://home.igggstudio.com/">허브</a>
      <span class="iggg-shell-email" id="igShellEmail"></span>
      <button class="iggg-shell-btn" type="button" id="igShellLogout">로그아웃</button>
      <button class="theme-toggle" id="themeToggle" type="button" onclick="toggleTheme()">다크 / 01</button>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      function toggleTheme() {
        const root = document.documentElement;
        const cur = root.dataset.theme || 'dark';
        const next = cur === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem('iggg-theme', next);
        const btn = document.getElementById('themeToggle');
        if (btn) btn.textContent = next === 'dark' ? '다크 / 01' : '라이트 / 02';
      }
      (function initTheme(){
        const saved = localStorage.getItem('iggg-theme');
        const sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        const t = saved || sys;
        document.documentElement.dataset.theme = t;
        document.addEventListener('DOMContentLoaded', () => {
          const btn = document.getElementById('themeToggle');
          if (btn) btn.textContent = t === 'dark' ? '다크 / 01' : '라이트 / 02';
        });
      })();

      // ── 공통 셸(허브·계정·로그아웃) — 12앱 공통 규약 2026-07-28 ──
      // iggg_sso 쿠키 = encodeURIComponent(JSON.stringify({email, refreshToken})).
      // 계정 표기는 textContent 로만(innerHTML 금지 — 쿠키는 신뢰 입력이 아니다).
      // 로그아웃은 쿠키를 지우고 www 의 전역 로그아웃 진입점으로 — ig-links 040c2b0 과 동일 규약
      // (www 루트로만 가면 세션 정본이 쿠키를 재발급해 로그아웃이 무효였다).
      (function initIgShell(){
        function mount(){
          try {
            const m = document.cookie.match(/(?:^|; )iggg_sso=([^;]*)/);
            if (m) {
              const email = (JSON.parse(decodeURIComponent(m[1])) || {}).email || '';
              const el = document.getElementById('igShellEmail');
              if (email && el) el.textContent = email;
            }
          } catch (e) { /* 계정 표시 실패는 치명 아님 */ }
          const btn = document.getElementById('igShellLogout');
          if (btn) btn.addEventListener('click', () => {
            document.cookie = 'iggg_sso=; Path=/; Domain=.igggstudio.com; Max-Age=0';
            location.href = 'https://www.igggstudio.com/?logout=1';
          });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
        else mount();
      })();
    </script>
  </body>
</html>
